<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandu Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    header {
      background: #111;
      color: white;
      padding: 25px;
    }

    .card {
      background: white;
      margin: 30px auto;
      padding: 25px;
      max-width: 400px;
      border-radius: 15px;
      box-shadow: 0 3px 10px #ccc;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Pandu</h1>
    <p>Welcome to my website</p>
  </header>

  <div class="card">
    <h2>Hello 👋</h2>
    <p>This is my first website.</p>
    <button onclick="alert('Welcome!')">Click Me</button>
  </div>

</body>
</html>
